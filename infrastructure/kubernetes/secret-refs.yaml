# CoreGrid Cloud Fabric — secret REFERENCES (no values, ever).
#
# Workloads read secrets through the external-secrets operator from the provider
# secret store. This file declares WHICH secret maps to WHICH key, never a value.
# Rotating a secret is a store-side action; pods pick it up on the next sync.
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: coregrid-secret-store
  namespace: coregrid-platform
spec:
  provider:
    # Provider is chosen per environment by the operator (OCI Vault, Hetzner-side
    # vault, or the CI-injected store). The contract — names and keys — is fixed here.
    fake:
      version: "v1"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: coregrid-data-credentials
  namespace: coregrid-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: coregrid-secret-store
    kind: SecretStore
  target:
    name: coregrid-data-credentials
    creationPolicy: Owner
  data:
    - secretKey: SUPABASE_URL
      remoteRef:
        key: coregrid/data/SUPABASE_URL
    - secretKey: SUPABASE_PUBLISHABLE_KEY
      remoteRef:
        key: coregrid/data/SUPABASE_PUBLISHABLE_KEY
    - secretKey: SUPABASE_SERVICE_ROLE_KEY
      remoteRef:
        key: coregrid/data/SUPABASE_SERVICE_ROLE_KEY
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: coregrid-platform-credentials
  namespace: coregrid-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: coregrid-secret-store
    kind: SecretStore
  target:
    name: coregrid-platform-credentials
    creationPolicy: Owner
  data:
    - secretKey: VAPID_PRIVATE_KEY
      remoteRef:
        key: coregrid/platform/VAPID_PRIVATE_KEY
    - secretKey: PAYSTACK_SECRET_KEY
      remoteRef:
        key: coregrid/platform/PAYSTACK_SECRET_KEY
    - secretKey: AI_API_KEY
      remoteRef:
        key: coregrid/platform/AI_API_KEY
---
# Sandbox never receives provider credentials or tenant data credentials.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: coregrid-sandbox-fixtures
  namespace: coregrid-dev
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: coregrid-secret-store
    kind: SecretStore
  target:
    name: coregrid-sandbox-fixtures
    creationPolicy: Owner
  data:
    - secretKey: SANDBOX_FIXTURE_TOKEN
      remoteRef:
        key: coregrid/sandbox/FIXTURE_TOKEN
