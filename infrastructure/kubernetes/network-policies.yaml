# CoreGrid Cloud Fabric — zero-trust network policy.
#
# LAW: every namespace is default-deny for ingress AND egress. Traffic is allowed
# only by explicit policy, and each allowance states its reason. DNS egress is the
# single universal exception (without it nothing resolves).
#
# The sandbox namespace's isolation lives in ./sandbox/sandbox-isolation.yaml and
# is stricter than this file.
---
# ── coregrid-system ─────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: coregrid-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: coregrid-system
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-traffic-layer
  namespace: coregrid-system
spec:
  podSelector:
    matchLabels:
      coregrid.io/role: ingress
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
# ── coregrid-platform ───────────────────────────────────────────────────────
