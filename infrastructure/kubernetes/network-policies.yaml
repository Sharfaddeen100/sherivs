---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: coregrid-monitoring
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
---
# Scraping is pull-based: monitoring reaches only namespaces that opt in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-scrape-egress
  namespace: coregrid-monitoring
spec:
  podSelector:
    matchLabels:
      coregrid.io/role: scraper
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: coregrid.io/scrape
                operator: In
                values: ["enabled"]
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 8080
---
