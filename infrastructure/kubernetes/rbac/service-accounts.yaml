# CoreGrid Cloud Fabric — RBAC baseline.
#
# LAW: no workload receives cluster-admin, and no ServiceAccount token is
# auto-mounted unless a workload genuinely calls the API server. Permissions are
# granted per namespace, per purpose, and reviewed in the change record.
---
# Platform services: read pods/services for health and discovery; nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coregrid-platform-service
  namespace: coregrid-platform
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coregrid-platform-observer
  namespace: coregrid-platform
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coregrid-platform-observer
  namespace: coregrid-platform
subjects:
  - kind: ServiceAccount
    name: coregrid-platform-service
    namespace: coregrid-platform
roleRef:
  kind: Role
  name: coregrid-platform-observer
  apiGroup: rbac.authorization.k8s.io
---
# Agent runtime: agents may not touch the Kubernetes API at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coregrid-agent
  namespace: coregrid-agents
automountServiceAccountToken: false
---
# Domain runtime: same posture — no API access by default.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coregrid-runtime
  namespace: coregrid-scholar
automountServiceAccountToken: false
---
# Sandbox: no API access, tiny permissions, it exists to be contained.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coregrid-sandbox
  namespace: coregrid-dev
automountServiceAccountToken: false
---
# Monitoring: read-only cluster visibility, necessary for scraping and alerting.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coregrid-monitoring-scraper
  namespace: coregrid-monitoring
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coregrid-monitoring-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coregrid-monitoring-read
subjects:
  - kind: ServiceAccount
    name: coregrid-monitoring-scraper
    namespace: coregrid-monitoring
roleRef:
  kind: ClusterRole
  name: coregrid-monitoring-read
  apiGroup: rbac.authorization.k8s.io
